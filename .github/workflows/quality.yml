name: Scholar quality

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"
      - "audit/**"
      - "design/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scholar-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: researchhub
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: placeholder-build-key
      NEXT_PUBLIC_SITE_URL: https://researchhubscholar.vercel.app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: researchhub/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependency advisories
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: IA-01 through IA-10 focused integration regression
        run: |
          node tests/query-preflight.cjs
          node tests/decs-auto.cjs
          node tests/decs-radar-flow.cjs
          node tests/evidence-provenance.cjs
          node tests/scientific-claim-validation.cjs
          node tests/study-design-extraction.cjs
          node tests/deep-results-evidence.cjs
          node tests/evidence-matrix-preview.cjs
          node tests/evidence-review.cjs
          node tests/project-evidence-handoff.cjs
          node tests/evidence-handoff-interface.cjs

      - name: AI reservation and financial regression
        run: node tests/financial.cjs

      - name: Asaas checkout and webhook contract tests
        run: node tests/asaas-checkout.cjs

      - name: Checkout access after email confirmation
        run: node tests/access-checkout-gate.cjs

      - name: Asaas webhook validation
        run: node tests/asaas-webhook.cjs

      - name: Production build
        run: npm run build

      - name: Tests
        run: npm test

      - name: Production smoke test
        run: npm run test:smoke
